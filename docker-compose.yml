version: "3.8"

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      - prisma

  prisma:
    image: node:18-alpine
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - ./prisma:/app/prisma
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
    command: sh -c "npm ci --legacy-peer-deps >/dev/null 2>&1 || true && npx prisma migrate deploy || true && npx prisma studio --port 5555 --hostname 0.0.0.0"
